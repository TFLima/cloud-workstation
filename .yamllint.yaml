extends: default
ignore: |
  .terraform/
rules:
  line-length:
    max: 120
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
    # "#cloud-config" precisa ser exatamente a primeira linha.
    ignore: |
      infrastructure/cloud-init/
