# Serviços de apoio por perfil. Regras (verificadas em tests/static):
#  - portas publicadas somente em 127.0.0.1 (acesso via túnel SSH);
#  - nenhum segredo literal; senhas vêm do ambiente/arquivo .env local da VM;
#  - imagens oficiais com tag fixa. Pinar por digest exigiria resolvê-lo contra
#    o Docker Hub a partir de uma rede confiável (não deu para confirmar um
#    digest correto a partir deste ambiente de build na Fase 3 -- ver
#    docs/phase-3-report.md); a tag completa (ex.: postgres:17.6-bookworm) já
#    fixa a versão, só não trava o conteúdo exato caso a tag seja reconstruída.
name: cdw

services:
  tools:
    # Imagem construída a partir de docker/Dockerfile.dev (ADR-0004) pelo
    # workflow build-images.yml e publicada manualmente no GHCR; nunca
    # construída nem publicada a partir da VM.
    # ghcr.io/<owner>/cloud-workstation-dev@sha256:<digest>, definido no .env
    # da VM após publicar a imagem pelo workflow build-images.yml.
    # Sem ":?" aqui: o Compose interpola TODO serviço declarado no arquivo,
    # mesmo um fora do(s) perfil(is) pedidos (ex.: "--profile db" ainda falha
    # a interpolação de services.tools). A obrigatoriedade real de
    # CDW_TOOLS_IMAGE quando o perfil tools/full é usado já é verificada em
    # scripts/deploy.sh, antes de chamar o Compose.
    image: ${CDW_TOOLS_IMAGE:-}
    profiles: ["tools", "full"]
    init: true
    working_dir: /home/dev/work
    volumes:
      - ${CDW_PROJECTS_DIR:-/home/dev/work}:/home/dev/work
    deploy:
      resources:
        limits:
          memory: 4g
    command: ["sleep", "infinity"]
    restart: unless-stopped

  postgres:
    image: postgres:17.6-bookworm
    profiles: ["db", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      # Sem ":?": o Compose interpola todo serviço do arquivo mesmo fora do
      # perfil pedido (ver comentário equivalente em services.tools.image);
      # a obrigatoriedade real quando o perfil db/full é usado já é
      # verificada em scripts/deploy.sh antes de chamar o Compose.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  redis:
    image: redis:7.4-bookworm
    profiles: ["cache", "full"]
    # Sem "--appendonly yes": só RDB (pontos de "save" padrão da imagem).
    # O backup (scripts/lib/backup-remote.sh) já faz "SAVE" + copia o
    # dump.rdb; com AOF ligado, um restore (restaurar o dump.rdb e reiniciar)
    # é ignorado, porque o Redis recarrega o AOF existente em vez do RDB
    # copiado (achado real de revisão no PR da Fase 4) — testado neste
    # sandbox com um container Redis real. RDB puro é consistente com o
    # próprio método de backup usado aqui.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

# Rótulos "cdw.backup" documentam a convenção de backup por volume (Fase 4,
# ADR-0003); scripts/lib/backup-remote.sh e restore-remote.sh implementam os
# dois serviços concretos deste Compose (postgres via pg_dump, redis via
# SAVE + cópia do dump.rdb), não um motor genérico guiado pelo rótulo.
volumes:
  pgdata:
    labels:
      cdw.backup: "pg_dump"
  redisdata:
    labels:
      cdw.backup: "files"
